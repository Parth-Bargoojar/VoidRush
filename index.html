<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#080a0f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VOIDRUSH" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="VOIDRUSH" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon-180.png" />
    <meta
      name="description"
      content="VOIDRUSH - a first-person endless flight through a voxel tunnel. Dodge, thread the gap, go faster."
    />
    <title>VOIDRUSH — Endless Flight</title>
    <link rel="canonical" href="https://getvoidrush.vercel.app/" />

    <!-- Open Graph / Facebook / Discord / WhatsApp / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VOIDRUSH" />
    <meta property="og:url" content="https://getvoidrush.vercel.app/" />
    <meta property="og:title" content="VOIDRUSH — Endless Flight" />
    <meta
      property="og:description"
      content="VOIDRUSH - a first-person endless flight through a voxel tunnel. Dodge, thread the gap, go faster."
    />
    <meta property="og:image" content="https://getvoidrush.vercel.app/og-image.png" />
    <meta property="og:image:secure_url" content="https://getvoidrush.vercel.app/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="VOIDRUSH — Endless Flight: first-person endless voxel tunnel runner"
    />

    <!-- X / Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://getvoidrush.vercel.app/" />
    <meta name="twitter:title" content="VOIDRUSH — Endless Flight" />
    <meta
      name="twitter:description"
      content="VOIDRUSH - a first-person endless flight through a voxel tunnel. Dodge, thread the gap, go faster."
    />
    <meta name="twitter:image" content="https://getvoidrush.vercel.app/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="VOIDRUSH — Endless Flight: first-person endless voxel tunnel runner"
    />
    <meta name="twitter:image:type" content="image/png" />
    <meta name="twitter:image:width" content="1200" />
    <meta name="twitter:image:height" content="630" />
    <!-- Dark before the stylesheet arrives: no white flash on an app launch. -->
    <style>html,body{background:#080a0f;color:#f5f7fa}</style>
  </head>
  <body>
    <div id="root">
      <!-- Replaced by React on mount; shown only while the bundle parses. -->
      <div class="boot">
        <div class="boot__title">VOIDRUSH</div>
        <div class="boot__subtitle">INITIALIZING...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
